.brand{font-family:var(--title);font-size:44px;line-height:1.05;margin:0;color:var(--accent);text-wrap:balance}
.rule{width:56px;height:5px;border-radius:3px;background:var(--accent);margin:14px 0 12px}
.biz{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--ink)}
.sub{color:var(--muted);font-size:16px;font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:44px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:center;align-items:center;padding:16px;border-radius:14px;background:var(--tile);color:var(--tile-ink);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile .cat{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--tile-sub)}
.tile .tname{font-family:var(--display);font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.clock{position:fixed;inset:auto 0 0;z-index:4;padding-block:12px calc(34px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);display:flex;justify-content:center;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clock span{white-space:nowrap}
.clock .sep{opacity:.6}
.clock .t{direction:ltr;unicode-bidi:isolate}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);margin-top:16px;font-weight:600}
.tile .tstate{margin-top:auto;font-size:14px;font-weight:700;color:var(--muted)}
.tile .tstate.done{color:var(--accent)}
.tile .tstate.part{color:var(--warn)}

/* supplier view */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:800;font-size:15px;padding:6px 0;cursor:pointer}
.sname{font-family:var(--display);font-size:26px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.spacer{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:14px;padding:6px 4px;cursor:pointer}

.cols{display:grid;grid-template-columns:1fr 64px 76px 64px;gap:8px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:14px 0 6px}
.cols span:not(:first-child){text-align:center}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:grid;grid-template-columns:1fr 64px 76px 64px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
li.has-order{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
li.over{border-color:var(--err);background:var(--err-soft)}
li.over input.num[id^="v_"]{border-color:var(--err);color:var(--err)}
.errmsg{font-size:13px;font-weight:800;color:var(--err);margin-top:2px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
li.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){li.shake{animation:none}}
li.unmarked{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
li.unmarked .name::after{content:attr(data-miss);display:block;font-size:13px;font-weight:800;color:var(--err);margin-top:2px}
.hist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hist details{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:14px 14px}
.hist summary::-webkit-details-marker{display:none}
.hist .when{font-weight:800;flex:1;min-width:0}
.hist .n{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .chev{color:var(--muted);transition:transform .15s}
.hist details[open] .chev{transform:rotate(180deg)}
.hist ul{gap:0;padding:0 14px 12px}
.hist li{display:flex;justify-content:space-between;gap:12px;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 0}
.hist .hn{min-width:0}
.hist .hn small{display:block;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hist li b{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent)}
.hist .hnote{padding:0 14px 12px;color:var(--muted);font-size:14px}
.total{max-width:640px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;font-size:14px;color:var(--muted)}
.total b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block}
.total b.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.total b.bump{animation:none}}
.total-note{max-width:640px;margin:-4px auto 8px;font-size:12px;color:var(--muted)}
.price{white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.price .line{display:block;white-space:nowrap;color:var(--accent);font-weight:800}
.hist .tot{padding:4px 14px 0;display:flex;justify-content:space-between;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hist .tot.sub{color:var(--muted);font-weight:600;font-size:14px}
.hist .tot.grand{padding:8px 14px 14px;margin-top:6px;border-top:1px solid var(--line);font-weight:800;color:var(--accent);font-size:17px}

/* compare box: a large window from the header buttons down, hiding the product list */
.over-ask{position:fixed;top:var(--oa-top,140px);bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:25;margin:0;border:2px solid var(--err);border-radius:16px;background:var(--err-soft);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.over-ask > *{width:100%;max-width:520px;margin-inline:auto}
.over-ask .oa-text{gap:8px}
.over-ask .oa-text b{font-size:20px;text-align:center}
.over-ask #oaAmount{font-size:44px;line-height:1.1;text-align:center;align-self:center;margin-block:6px}
.over-ask .oa-text small{font-size:15px}
.over-ask .oa-month{font-size:15px}
.over-ask .oa-btns button{font-size:17px;padding:15px 16px}
.oa-text{display:flex;flex-direction:column;gap:2px}
.oa-text b{color:var(--err);font-size:15px}
#oaAmount{font-family:var(--display);font-size:26px;color:var(--err);font-variant-numeric:tabular-nums}
.oa-text small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.oa-month{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.oa-month:empty{display:none}
#oaMonth{margin-top:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,currentColor 15%,transparent)}
.oa-month .up{color:var(--err)} .oa-month .down{color:var(--ok)}
.oa-btns{display:flex;gap:8px}
.oa-btns button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.oa-yes{flex:1;background:var(--err);color:#fff}
.oa-no{background:var(--card);color:var(--ink)}
.over-ask.good{background:var(--ok-soft);border-color:var(--ok)}
.over-ask.good .oa-text b,.over-ask.good #oaAmount{color:var(--ok)}
.over-ask.good .oa-yes{background:var(--ok);color:#fff}
.clear-ask{margin-top:10px;background:var(--err-soft);border:1px solid var(--err);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:800;color:var(--err)}
.ca-btns{display:flex;gap:8px}
.ca-btns button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.ca-yes{background:var(--err);color:#fff}
.ca-no{background:var(--card);color:var(--ink)}
.pin-ask{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pin-ask{align-items:center;text-align:center}
.pin-ask label{font-weight:800;font-size:17px}
.pin-row{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;width:100%}
.pin-row input{box-sizing:border-box;max-width:100%}
.pin-err:empty{display:none}
.pin-row input{width:9em;font:inherit;font-size:24px;letter-spacing:.5em;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.pin-row button{font:inherit;font-weight:800;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.pin-err{min-height:1.2em;font-size:13px;font-weight:800;color:var(--err)}
.pin-ask.shake{animation:shake .35s}
#list.editing li{background:color-mix(in srgb,var(--card) 70%,var(--ink) 30%)}
#list.editing input[id^="v_"]{opacity:.35}
#list.editing .name{opacity:1}
#list.editing .name > :not(.price-edit):not(.namein){opacity:.6}
#list.editing .target{opacity:1}
#list.editing input[id^="t_"]{background:#fff;color:#1c2a24;border:2px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);font-weight:800}
.meta .link{font-size:13px;padding:6px 2px}
.meta .link.smart{padding:6px 10px;gap:5px}
.meta .link.smart::before{width:15px;height:15px}
.noprice{display:flex;width:fit-content;align-items:center;gap:4px;margin-top:2px;padding:0;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.price-edit span{white-space:nowrap}
.price-edit{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
#list.editing .name .price-edit{opacity:1}
input.num.pricein{width:76px;font-size:16px;padding:6px 4px;background:#fff;color:#1c2a24;border:2px solid var(--warn)}
input.namein{width:100%;box-sizing:border-box;font:inherit;font-weight:600;font-size:15px;padding:6px 8px;border:2px solid var(--accent);border-radius:8px;background:#fff;color:#1c2a24}
#list.editing .name > input.namein{opacity:1}
li.addrow{display:block;background:none;border:2px dashed var(--accent);padding:0}
li.addrow button{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px;text-align:center;font-weight:800;color:var(--accent);cursor:pointer}
li.addrow button:focus-visible{outline:2px solid var(--accent)}
.order.acts{display:flex;flex-direction:column;gap:5px;opacity:1 !important}
.acts button{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:8px;padding:6px 4px;cursor:pointer;width:100%}
.act-del{background:var(--err);color:#fff}
.act-hide{background:#8c8a84;color:#fff}
#list.editing li.is-hidden{opacity:.55}
#list.editing li.is-hidden .act-hide{background:var(--accent);color:var(--accent-ink)}
.dlg-back{position:fixed;inset:0;z-index:30;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(340px,100%);background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg-q{font-family:var(--display);font-size:20px;line-height:1.25;color:var(--ink);text-wrap:balance}
.dlg-name{font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.dlg-btns{display:flex;gap:8px;margin-top:6px}
.dlg-btns button{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
.dlg-yes{flex:1;color:#fff}
.dlg.del .dlg-yes{background:var(--err)}
.dlg.hide .dlg-yes{background:#8c8a84}
.dlg-no{background:var(--bg);color:var(--ink)}
li.noname input.namein{border-color:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 20%,transparent)}
li.noname .name::after{content:attr(data-noname);display:block;font-size:13px;font-weight:800;color:var(--err);margin-top:4px}
.link.pencil{display:inline-flex;align-items:center;gap:4px}

#supView.editing-on .notes{display:none}

.home-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center -64vh;background-size:auto 172%;background-color:transparent;opacity:.13;filter:grayscale(.35) contrast(1.05)}
/* opening screen: the photo in full for a second, then it fades into the shadow */
.intro-bg{position:fixed;inset:0;z-index:50;background-color:#1c322a;background-position:center;background-size:cover;opacity:1;transition:opacity 1s ease}
.intro-bg.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.intro-bg{transition:none}}

body.on-home::before{background:transparent!important}
body.on-home{background-color:var(--bg)}
#homeView .clock{background:transparent}

.name{font-weight:600;min-width:0;overflow-wrap:anywhere}

.notes label{font-weight:700;font-size:14px}
textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:64px;resize:vertical}

.bar{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{font:inherit;font-weight:800;font-size:17px;border-radius:10px;padding:13px 16px;border:0;cursor:pointer}
.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.primary:disabled{opacity:.45;cursor:default}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;min-height:1em}

.keypad{position:fixed;inset:auto 0 0;z-index:8;background:var(--kp-bg);border-top:1px solid var(--line);padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}

.kp-top{display:flex;justify-content:flex-start;padding:0 4px 2px}

body.kp-open #supView header .meta{display:none}
body.kp-open #supView header{padding-block:4px 6px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
const fmtDate = d => d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"});
const load = (k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const save = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const num = v => { if(v===""||v==null) return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const trim = n => Math.round(n*100)/100;

// carry over data saved before suppliers were split into pages
(function migrate(){
  const oldT=load("hl_targets",null), oldD=load("hl_day",null);
  if(oldT && !load("hl_targets_yeshm",null)) save("hl_targets_yeshm",oldT);
  if(oldD && !load("hl_day_yeshm",null)) save("hl_day_yeshm",oldD);
})();

function stateOf(s){
  const targets = load("hl_targets_"+dataKey(s),{});
  let day = load("hl_day_"+dataKey(s),null);
  if(!day || day.date!==todayKey()) day = {date:todayKey(), vals:{}, note:""};
  // prices updated on this phone override the invoice prices
  // products added on this phone, and renamed products
  const extra = load("hl_extra_"+dataKey(s),[]);
  extra.forEach(x=>{ if(!s.products.some(p=>p.id===x.id)) s.products.push({id:x.id,name:x.name,target:x.target,custom:true,basePrice:null,price:null}); });
  const names = load("hl_names_"+dataKey(s),{});
  s.products.forEach(p=>{
    if(p.baseName===undefined){ p.baseName=p.name; p.baseFr=p.fr; }
    const n=names[p.id]||{};
    p.name = n.he || p.baseName; p.fr = n.fr || p.baseFr;
  });
  const prices = load("hl_prices_"+dataKey(s),{});
  s.products.forEach(p=>{ p.price = (p.id in prices) ? prices[p.id] : (p.basePrice ?? null); });
  const hidden = load("hl_hidden_"+dataKey(s),[]), removed = load("hl_removed_"+dataKey(s),[]);
  return {targets,day,prices,names,extra,hidden,removed};
}
const targetOf = (p,st) => (p.id in st.targets) ? st.targets[p.id] : p.target;
function orderOf(p,st){
  const t=targetOf(p,st), v=num(st.day.vals[p.id]);
  if(t==null) return v;
  if(v==null) return null;
  return trim(Math.max(0,t-v));
}
// hidden / deleted products are left out of counting, totals and checks
const excluded = (p,st) => !!st && ((st.hidden||[]).includes(p.id) || (st.removed||[]).includes(p.id));
const linesOf = (s,st) => s.products.filter(p=>!excluded(p,st)).map(p=>({p,o:orderOf(p,st)})).filter(x=>x.o>0);
const missingOf = (s,st) => s.products.filter(p=>!excluded(p,st) && targetOf(p,st)!=null && num(st.day.vals[p.id])==null).length;

const list=document.getElementById("list");
// number fields use the page's own keypad (digits + wide Enter), not the phone keyboard
function numField(el){ el.type="text"; el.setAttribute("inputmode","none"); el.autocomplete="off"; }
function columnInputs(prefix){ return [...list.querySelectorAll('input.num[id^="'+prefix+'"]')]; }
const kp=document.getElementById("keypad"), kpEnter=document.getElementById("kpEnter");
let active=null, fresh=false;
function activate(el){
  if(active) active.classList.remove("active");
  active=el; fresh=true; el.classList.add("active");
  const col=columnInputs(el.id.slice(0,2));
  kpEnter.textContent = col.indexOf(el)===col.length-1 ? tr().done : tr().next;
  kp.hidden=false; document.body.classList.add("kp-open"); bar.hidden=true;
  requestAnimationFrame(()=>{
    // put the current product just under the header, so the next ones show above the keypad
    const hb=document.querySelector("#supView header").getBoundingClientRect().bottom;
    const r=el.closest("li").getBoundingClientRect();
    window.scrollBy({top:r.top-(hb+8),behavior:"smooth"});
  });
}
function closeKeypad(){
  if(active){ active.classList.remove("active"); active.blur(); }
  active=null; kp.hidden=true; document.body.classList.remove("kp-open");
  if(cur) bar.hidden=false;
}
function setVal(v){ active.value=v; active.dispatchEvent(new Event("input",{bubbles:true})); }
function isOver(el){ return !!el && el.closest("li") && el.closest("li").classList.contains("over"); }
function isEmpty(el){
  if(!el || !el.id.startsWith("v_") || el.value.trim()!=="") return false;
  const p=cur && cur.products.find(x=>x.id===el.id.slice(2));
  return !!p && targetOf(p,st)!=null; // products without a target may stay empty
}
function blocked(el){ return isOver(el) || isEmpty(el); }
function blockOver(){
  const li=active.closest("li");
  li.classList.remove("shake"); void li.offsetWidth; li.classList.add("shake");
  setStatus(isEmpty(active) ? tr().needQty : tr().fixQty);
  try{ navigator.vibrate && navigator.vibrate(120); }catch(_){}
}
function goNext(){
  if(!active) return;
  if(blocked(active)) return blockOver();
  const col=columnInputs(active.id.slice(0,2)); const next=col[col.indexOf(active)+1];
  if(next) activate(next); else { closeKeypad(); setStatus(tr().listDone); }
}
list.addEventListener("focusin",e=>{
  if(!e.target.matches("input.num")) return;
  { const p=needsName(); if(p){ e.target.blur(); blockNoName(p); return; } } // no numbers until the new product has a name
  if(active && active!==e.target && blocked(active)){ const back=active; e.target.blur(); back.focus(); blockOver(); return; }
  activate(e.target);
});
list.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("input.num")){ e.preventDefault(); goNext(); } });
kp.addEventListener("pointerdown",e=>e.preventDefault()); // keep the field focused
kp.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!active) return;
  const k=b.dataset.k;
  if(k==="enter") return goNext();
  if(k==="close") return closeKeypad();
  if(k==="del"){ fresh=false; return setVal(active.value.slice(0,-1)); }
  let v = fresh ? "" : active.value; fresh=false;
  if(k==="."){ if(v.includes(".")) return; v = v ? v+"." : "0."; }
  else v = (v==="0" ? "" : v) + k;
  setVal(v);
});
document.addEventListener("pointerdown",e=>{
  if(active && !kp.contains(e.target) && !e.target.matches("input.num")) closeKeypad();
});

// ---------- PDF: draw each A4 page on a canvas (handles Hebrew right-to-left), then wrap as PDF
async function drawPages(s){
  try{ await Promise.all([document.fonts.load('48px "Secular One"'),document.fonts.load('700 30px "Assistant"'),document.fonts.load('400 30px "Assistant"')]); }catch(e){}
  const cv=document.getElementById("cv"); const W=1240,H=1754,M=90;
  const ctx=cv.getContext("2d");
  const rows=linesOf(s,st); const d=new Date();
  const perFirst=22, perNext=30; const pages=[rows.slice(0,perFirst)];
  for(let i=perFirst;i<rows.length;i+=perNext) pages.push(rows.slice(i,i+perNext));
  const out=[]; const ink="#1c2a24", green="#1c322a", grey="#5c5e55", line="#c7c2b5";
  pages.forEach((pg,pi)=>{
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.direction="rtl"; ctx.textAlign="right"; ctx.textBaseline="alphabetic";
    let y=M+40;
    if(pi===0){
      ctx.fillStyle=green; ctx.font='56px "Secular One", "Assistant", sans-serif';
      ctx.fillText(s.pdfName||s.name,W-M,y);
      ctx.textAlign="left"; ctx.fillStyle=grey; ctx.font='400 30px "Assistant", sans-serif';
      ctx.fillText(d.toLocaleDateString("he-IL")+"  "+fmtTime(d),M,y); ctx.textAlign="right";
      y+=60;
      ctx.fillStyle=ink; ctx.font='700 34px "Assistant", sans-serif';
      ctx.fillText(BUSINESS,W-M,y); y+=46;
      ctx.font='400 30px "Assistant", sans-serif';
      ctx.fillText("סניף ראשון לציון, יוסף לישנסקי 17",W-M,y); y+=34;
      ctx.fillStyle=green; ctx.fillRect(M,y,W-2*M,4); y+=60;
    } else {
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif';
      ctx.fillText(BUSINESS+" · המשך הזמנה · "+d.toLocaleDateString("he-IL")+" "+fmtTime(d),W-M,y); y+=50;
    }
    ctx.fillStyle=grey; ctx.font='700 26px "Assistant", sans-serif';
    ctx.fillText("#",W-M,y); ctx.fillText("מוצר",W-M-70,y);
    ctx.textAlign="left"; ctx.fillText("כמות",M+10,y); ctx.textAlign="right";
    y+=22; ctx.fillStyle=line; ctx.fillRect(M,y,W-2*M,2); y+=8;
    const rowH=52;
    pg.forEach((x,ri)=>{
      const n=(pi===0?0:perFirst+(pi-1)*perNext)+ri+1;
      if(ri%2===0){ ctx.fillStyle="#efede8"; ctx.fillRect(M,y,W-2*M,rowH); }
      const base=y+36;
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif'; ctx.fillText(String(n),W-M-6,base);
      ctx.fillStyle=ink; ctx.font='600 30px "Assistant", sans-serif';
      let nm=x.p.name; const maxW=W-2*M-260;
      while(ctx.measureText(nm).width>maxW && nm.length>4) nm=nm.slice(0,-2)+"…";
      ctx.fillText(nm,W-M-70,base);
      ctx.textAlign="left"; ctx.fillStyle=green; ctx.font='700 34px "Assistant", sans-serif';
      ctx.fillText(String(x.o),M+14,base); ctx.textAlign="right";
      y+=rowH;
    });
    if(pi===pages.length-1){
      y+=20; ctx.fillStyle=line; ctx.fillRect(M,y,W-2*M,2); y+=50;
      ctx.fillStyle=ink; ctx.font='700 30px "Assistant", sans-serif';
      ctx.fillText("סה״כ שורות: "+rows.length,W-M,y); y+=56;
      if(st.day.note){
        ctx.fillText("הערה:",W-M,y); y+=44;
        ctx.font='400 30px "Assistant", sans-serif';
        let ln="";
        st.day.note.split(/\s+/).forEach(w=>{ const t=ln?ln+" "+w:w; if(ctx.measureText(t).width>W-2*M){ ctx.fillText(ln,W-M,y); y+=42; ln=w; } else ln=t; });
        if(ln){ ctx.fillText(ln,W-M,y); y+=42; }
      }
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif';
      ctx.fillText("תודה!",W-M,y+30);
    }
    ctx.fillStyle=grey; ctx.font='400 22px "Assistant", sans-serif'; ctx.textAlign="center";
    ctx.fillText("הופק ב-"+fmtDate(d)+" בשעה "+fmtTime(d)+"   ·   עמוד "+(pi+1)+" מתוך "+pages.length,W/2,H-50); ctx.textAlign="right";
    out.push(cv.toDataURL("image/jpeg",0.92));
  });
  return out;
}

const SMART_N = 5;

document.getElementById("smartBtn").addEventListener("click",()=>{
  const btn=document.getElementById("smartBtn");
  const h=load("hl_hist_"+dataKey(cur),[]).slice(0,SMART_N);
  const hasValues=cur.products.some(p=>String(st.day.vals[p.id] ?? "").trim()!=="");

    smartArmed=true; btn.textContent=tr().smartArm;
    setTimeout(()=>{ smartArmed=false; btn.textContent=tr().smart; },3000);
    return;
  }
  smartArmed=false; btn.textContent=tr().smart;
  if(!h.length){
    // no orders yet: full order – every product up to its target
    cur.products.forEach(p=>{ if(!p.section && !excluded(p,st) && targetOf(p,st)!=null) st.day.vals[p.id]="0"; });
    saveDay(); render(); window.scrollTo(0,0);
    setStatus(tr().smartFull);
    return;
  }
  const avg={};
  h.forEach(o=>o.items.forEach(it=>{ avg[it.id]=(avg[it.id]||0)+Number(it.q||0); }));
  cur.products.forEach(p=>{
    if(p.section || excluded(p,st)) return;
    const a=Math.round((avg[p.id]||0)/h.length);   // missing in an order counts as 0
    const t=targetOf(p,st);
    if(t!=null) st.day.vals[p.id]=String(Math.max(0,t-a)); // "נשאר" so that target − נשאר = average
    else st.day.vals[p.id]= a>0 ? String(a) : "";
  });
  saveDay(); render(); window.scrollTo(0,0);
  setStatus(tr().smartDone(h.length));
});

function afterSent(s){

async function shareFile(file,s){
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file]});
      afterSent(s);
    }catch(e){
      if(e && e.name==="NotAllowedError"){
        pendingFile=file; pendingSup=s;
        document.getElementById("pdfBtn").textContent=tr().ready;
        setStatus(tr().tapAgain);
      } else if(e && e.name==="AbortError"){ setStatus(tr().cancelled); }
      else setStatus(tr().shareFail);
    }
  } else {
    const url=URL.createObjectURL(file); const a=document.createElement("a");
    a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    afterSent(s);
  }
}
document.getElementById("pdfBtn").addEventListener("click",e=>{
  if(!pendingFile) return;
  e.stopImmediatePropagation();
  const f=pendingFile, s=pendingSup;
  navigator.share({files:[f]}).then(()=>afterSent(s)).catch(err=>{
    if(err && err.name==="AbortError") setStatus(tr().cancelled); else setStatus(tr().shareFail);
  });
},true);
document.getElementById("pdfBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("pdfBtn"); btn.disabled=true; setStatus(tr().preparing);
  const s=cur;
  try{
    const imgs=await drawPages(s);
    if(!window.jspdf){ setStatus(tr().noLib); return; }
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    imgs.forEach((im,i)=>{ if(i) pdf.addPage(); pdf.addImage(im,"JPEG",0,0,210,297); });
    const blob=pdf.output("blob");
    lastSnap=snapshotOrder(s);
    const d=new Date();
    const fname="הזמנה הלחמניא - "+(s.pdfName||s.name).replace(/["״]/g,"")+" "+d.getDate()+"-"+(d.getMonth()+1)+"-"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0")+".pdf";
    const file=new File([blob],fname,{type:"application/pdf"});
    await shareFile(file,s);
    return;
    // order sent: reset this supplier's count so the next order starts clean
    recordOrder(s,lastSnap); lastSnap=null;
    save("hl_day_"+dataKey(s),{date:todayKey(),vals:{},note:""});
    if(cur===s){ showHome(); }
  }catch(e){
    const c=e&&e.code;
    if(c==="declined") setStatus(tr().cancelled);
    else if(c==="rate_limited") setStatus(tr().busy);
    else setStatus(tr().fail);
  }finally{ if(cur===s) summary(); btn.disabled = cur ? linesOf(cur,st).length===0 : false; }
});

const fmtTime = d => d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
function tick(){
  const now=new Date(), c=document.getElementById("clock");
  const parts=[
    [now.toLocaleDateString("he-IL",{weekday:"long"}),""],
    [now.toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"numeric"}),"t"],
    [now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),"t"]];
  c.textContent="";
  parts.forEach(([txt,cls],i)=>{
    if(i){ const sp=document.createElement("span"); sp.className="sep"; sp.textContent="|"; c.appendChild(sp); }
    const e=document.createElement("span"); if(cls) e.className=cls; e.textContent=txt; c.appendChild(e);
  });
}
tick(); setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
// draw every ₪ sign in the phone's own font (the page fonts draw it differently)
(function(){
  const wrap=root=>{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes("₪") && !(n.parentNode && n.parentNode.classList && n.parentNode.classList.contains("sh")) ? 1 : 3});
    const list=[]; while(w.nextNode()) list.push(w.currentNode);
    list.forEach(n=>{
      const parts=n.nodeValue.split("₪"), f=document.createDocumentFragment();
      parts.forEach((t,i)=>{ if(i){ const sp=document.createElement("span"); sp.className="sh"; sp.textContent="₪"; f.appendChild(sp); } if(t) f.appendChild(document.createTextNode(t)); });
      n.parentNode.replaceChild(f,n);
    });
  };
  new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==="characterData"){ if(m.target.parentNode) wrap(m.target.parentNode); } else m.addedNodes.forEach(x=>wrap(x.nodeType===3 && x.parentNode ? x.parentNode : x)); }))
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  wrap(document.body);
})();
showHome();
(function(){
  const ib=document.getElementById("introBg"); if(!ib) return;
  const done=()=>{ ib.hidden=true; };
  setTimeout(()=>{ ib.classList.add("out"); setTimeout(done,1100); },1000);
  ib.addEventListener("click",()=>{ ib.classList.add("out"); setTimeout(done,400); });
})();
</script>
