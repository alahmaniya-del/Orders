<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: home = grid of supplier tiles; supplier view = sticky header + product rows (name · target · left · to order) + fixed send bar */
/* Halechmania brand colors (from the packaging): warm stone #c7c2b5, deep green #1c322a */
:root{
  --bg:#c7c2b5; --card:#d8d4ca; --ink:#1c2a24; --muted:#5c5e55; --line:#b1ab9d;
  --accent:#1c322a; --accent-ink:#e9e6df; --accent-soft:#b4b8a9; --warn:#7d4b0e; --warn-soft:#e2d3b6;
  --field:#e9e6df; --tile:#1c322a; --tile-ink:#d9d4c8; --tile-sub:#a9b5a6; --err:#b3261e; --err-soft:#f3d9d4; --ok:#2b7a4b; --ok-soft:#d5e9da;
  --title:"Suez One","Secular One",Georgia,serif;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15241e; --card:#1f3229; --ink:#e6e2d8; --muted:#a3a597; --line:#2f463b;
  --accent:#d3cdbf; --accent-ink:#1c322a; --accent-soft:#2b4237; --warn:#e2a456; --warn-soft:#3a2d1a;
  --field:#1a2b23; --tile:#c7c2b5; --tile-ink:#1c322a; --tile-sub:#4f6158; --err:#ff8a7a; --err-soft:#46211d; --ok:#74d39c; --ok-soft:#1d3a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15241e; --card:#1f3229; --ink:#e6e2d8; --muted:#a3a597; --line:#2f463b;
  --accent:#d3cdbf; --accent-ink:#1c322a; --accent-soft:#2b4237; --warn:#e2a456; --warn-soft:#3a2d1a;
  --field:#1a2b23; --tile:#c7c2b5; --tile-ink:#1c322a; --tile-sub:#4f6158; --err:#ff8a7a; --err-soft:#46211d; --ok:#74d39c; --ok-soft:#1d3a2a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 200px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
.home-head{padding-block:0 4px;margin-top:22px;display:flex;flex-direction:column;align-items:center}
.branch{margin-top:18px;font-family:var(--display);font-size:21px;line-height:1.15;color:var(--accent)}
.branch-sw{margin-top:16px;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,50,42,.12)}
.branch-sw button{all:unset;cursor:pointer;font-family:var(--display);font-size:17px;line-height:1.2;padding:7px 16px;border-radius:999px;color:var(--accent)}
.branch-sw button[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink)}
.branch-sw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.br-pin{position:absolute;top:100%;left:0;right:0;z-index:5;margin-top:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.home-head{position:relative}
.home-gear{position:absolute;top:-16px;inset-inline-end:-6px;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;color:var(--accent);background:rgba(28,50,42,.10);border:0;border-radius:50%;cursor:pointer}
/* reports */
#repView{padding-bottom:60px}
.rep-ctrl{display:block;margin:16px 0 8px}
.rep-ctrl label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.rep-ctrl select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 8px;width:100%}
.rep-sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.rep-sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.rep-sum b{display:block;font-size:25px;font-variant-numeric:tabular-nums}
.rep-sum div{padding:16px 8px!important}
.rep-sum span{font-size:12px;color:var(--muted);font-weight:700}
.rep-h{font-family:var(--display);font-size:18px;margin:18px 0 6px;color:var(--accent)}
.rep-t{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
.rep-t th{font-size:12px;color:var(--muted);font-weight:800;text-align:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.rep-t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.rep-t th:first-child,.rep-t td:first-child{text-align:start;padding-inline-start:12px}
.rep-t tr.tot td{font-weight:800;background:color-mix(in srgb,var(--accent) 10%,var(--card));border-bottom:0}
.rep-empty{margin:24px 0;text-align:center;color:var(--muted);font-weight:700}
.rep-note{font-size:12px;color:var(--muted);margin-top:6px}
.rep-note.warn{color:var(--warn);font-weight:800}
.rep-t tr.open td{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.rep-amt{all:unset;cursor:pointer;color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep-t td,.rep-t th{white-space:nowrap}
.rep-t td:first-child,.rep-t th:first-child{white-space:normal;word-break:break-word}
.rep-t td.tagc,.rep-t th.tagc{padding-inline:2px 6px;width:1%}
.rep-t .trend{font-weight:800;font-size:13px}
.rep-t td.dcol{font-size:12.5px;color:var(--muted);font-weight:700}
.up{color:var(--err)} .down{color:var(--ok)}
.rep-sum b.up{color:var(--err)} .rep-sum b.down{color:var(--ok)}
.rep-nf{all:unset;cursor:pointer;font-size:11px;font-weight:800;color:var(--warn);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.rep-per{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:4px 0 0}
.rep-per button{font-size:13.5px!important;line-height:1.15;padding:8px 2px!important}
.rep-per button{font:inherit;font-weight:800;font-size:15px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.rep-per button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rep-ctrl select.inactive{opacity:.55}
.np-dlg{width:min(380px,100%);max-height:80vh;overflow:auto}
.np-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:-4px}
.np-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.np-name{font-weight:700;min-width:0}
.np-edit{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--warn);white-space:nowrap}
.np-in{display:flex;gap:6px;align-items:center}
.np-in input{width:76px;font:inherit;font-size:16px;font-weight:700;text-align:center;padding:7px;border-radius:8px;border:1.5px solid var(--warn);background:var(--field);color:var(--ink)}
.np-in input.bad{border-color:var(--err)}
.np-ok{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.np-set{font-weight:800;color:var(--ok);white-space:nowrap}
.np-done{padding:14px 0;text-align:center;font-weight:700;color:var(--ok)}
.np-name small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.np-up{margin-top:22px;margin-bottom:-4px}
.np-msg:empty{display:none}
.np-dlg{position:relative}
.np-scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;border-radius:12px;padding:12px;background:var(--warn);color:#fff;cursor:pointer}
.np-scan,.np-donescr{position:absolute;inset:0;z-index:2;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.scan-doc{position:relative;width:110px;height:140px;border-radius:10px;background:#fff;border:2px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:9px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.scan-doc i{display:block;height:7px;border-radius:4px;background:var(--line)}
.scan-doc i:nth-child(odd){width:70%} .scan-doc i:nth-child(3n){width:85%}
.scan-doc .beam{position:absolute;left:0;right:0;height:26px;top:-26px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--warn) 45%,transparent),transparent);border-bottom:2px solid var(--warn);animation:beam 1.6s ease-in-out infinite}
@keyframes beam{0%{top:-26px}50%{top:118px}100%{top:-26px}}
.scan-t{font-family:var(--display);font-size:20px;color:var(--accent)}
.scan-step{font-size:14px;font-weight:700;color:var(--muted);min-height:1.2em;animation:fadeStep .4s ease}
@keyframes fadeStep{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.np-donescr{justify-content:flex-start;padding-top:32px;overflow:auto}
.done-ic{width:76px;height:76px;flex:0 0 auto}
.done-ic circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dash .6s ease forwards}
.done-ic path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .4s .5s ease forwards}
.done-ic .ic-x{display:none} .np-donescr.warn .ic-ok{display:none} .np-donescr.warn .ic-x{display:block}
.np-donescr.warn .done-ic circle,.np-donescr.warn .done-ic path{stroke:var(--warn)}
@keyframes dash{to{stroke-dashoffset:0}}
.done-t{font-family:var(--display);font-size:22px;color:var(--accent)}
.done-s{font-size:14px;font-weight:700;color:var(--muted)}
.done-list{width:100%;text-align:start;margin-top:4px}
.done-list div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.done-list span:last-child{color:var(--ok);white-space:nowrap}
.np-donescr .np-close{width:100%;margin-top:auto}
.np-perm{width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px;background:var(--warn);color:#fff;cursor:pointer;margin-top:auto}
.np-perm:not([hidden]) + .np-close{margin-top:8px}
.np-msg{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px;min-height:1em}
.np-msg.ok{color:var(--ok)} .np-msg.warn{color:var(--warn)}
.np-close{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:6px}
.rep-det td{padding:6px 10px 12px;background:var(--field);text-align:start}
.rep-items{width:100%;border-collapse:collapse;font-size:13px}
.rep-items td{padding:5px 4px;border-bottom:1px dashed var(--line);text-align:start}
.rep-items td:nth-child(2){color:var(--muted);white-space:nowrap}
.rep-items td:last-child{text-align:end;white-space:nowrap;font-weight:700}
.rep-items td.nop{color:var(--warn)}
.rep-dt{display:flex;justify-content:space-between;font-size:13px;padding:4px 4px 0}
.rep-dt.g{font-weight:800}
.rep-dn{font-size:12px;color:var(--muted);margin-top:6px}
.rep-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.rep-btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.rep-btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.rep-btn:disabled{opacity:.5}
#totalBox.partial #totalLbl{color:var(--warn);font-weight:800}
.hist summary .n.partial{color:var(--warn)}
.hist small.nop{color:var(--warn);font-weight:700}
.hpart{font-size:13px;font-weight:700;color:var(--warn);margin:6px 0 2px}
.tot.part span:first-child{color:var(--warn);font-weight:800}
.srch{display:inline-flex;align-items:center;padding-inline:6px}
.search-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.search-row input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;padding:10px 12px;border-radius:12px;border:1.5px solid var(--accent);background:var(--field);color:var(--ink)}
.search-row button{font:inherit;font-size:16px;font-weight:800;border:0;background:none;color:var(--muted);padding:8px;cursor:pointer}
.app-ver{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.rep-status{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin-top:10px;min-height:1.2em}

.brand{font-family:var(--title);font-size:44px;line-height:1.05;margin:0;color:var(--accent);text-wrap:balance}
.rule{width:56px;height:5px;border-radius:3px;background:var(--accent);margin:14px 0 12px}
.biz{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--ink)}
.sub{color:var(--muted);font-size:16px;font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:44px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:center;align-items:center;padding:16px;border-radius:14px;background:var(--tile);color:var(--tile-ink);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile .cat{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--tile-sub)}
.tile .tname{font-family:var(--display);font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.clock{position:fixed;inset:auto 0 0;z-index:4;padding-block:12px calc(34px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);display:flex;justify-content:center;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clock span{white-space:nowrap}
.clock .sep{opacity:.6}
.clock .t{direction:ltr;unicode-bidi:isolate}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);margin-top:16px;font-weight:600}
.tile .tstate{margin-top:auto;font-size:14px;font-weight:700;color:var(--muted)}
.tile .tstate.done{color:var(--accent)}
.tile .tstate.part{color:var(--warn)}

/* supplier view */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:800;font-size:15px;padding:6px 0;cursor:pointer}
.sname{font-family:var(--display);font-size:26px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.spacer{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:14px;padding:6px 4px;cursor:pointer}

.cols{display:grid;grid-template-columns:1fr 64px 76px 64px;gap:8px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:14px 0 6px}
.cols span:not(:first-child){text-align:center}
/* headings sit exactly over their columns (same inner padding as the product boxes) */
.cols{padding-inline:11px;box-sizing:border-box}
.cols span{text-align:center}
.cols span:first-child{text-align:start}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:grid;grid-template-columns:1fr 64px 76px 64px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
li.has-order{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
li.over{border-color:var(--err);background:var(--err-soft)}
li.over input.num[id^="v_"]{border-color:var(--err);color:var(--err)}
.errmsg{font-size:13px;font-weight:800;color:var(--err);margin-top:2px}
.errmsg.cap{color:var(--warn)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
li.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){li.shake{animation:none}}
li.unmarked{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
li.unmarked .name::after{content:attr(data-miss);display:block;font-size:13px;font-weight:800;color:var(--err);margin-top:2px}
.hist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hist details{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:14px 14px}
.hist summary::-webkit-details-marker{display:none}
.hist .when{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .n{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .chev{color:var(--muted);transition:transform .15s}
.hist details[open] .chev{transform:rotate(180deg)}
.hist ul{gap:0;padding:0 14px 12px}
.hist li{display:flex;justify-content:space-between;gap:12px;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:8px 0}
.hist .hn{min-width:0}
.hist .hn small{display:block;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hist li b{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent)}
.hist .hnote{padding:0 14px 12px;color:var(--muted);font-size:14px}
.total{max-width:640px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;font-size:14px;color:var(--muted)}
.total b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block}
.total b.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.total b.bump{animation:none}}
.total-note{max-width:640px;margin:-4px auto 8px;font-size:12px;color:var(--muted)}
.price{white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.price .line{display:block;white-space:nowrap;color:var(--accent);font-weight:800}
.hist .tot{padding:4px 14px 0;display:flex;justify-content:space-between;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hist .tot.sub{color:var(--muted);font-weight:600;font-size:14px}
.hist .tot.grand{padding:8px 14px 14px;margin-top:6px;border-top:1px solid var(--line);font-weight:800;color:var(--accent);font-size:17px}

/* compare box: a large window from the header buttons down, hiding the product list */
.over-ask{position:fixed;top:var(--oa-top,140px);bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:25;margin:0;border:2px solid var(--err);border-radius:16px;background:var(--err-soft);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.over-ask > *{width:100%;max-width:520px;margin-inline:auto}
.over-ask .oa-text{gap:8px}
.over-ask .oa-text b{font-size:20px;text-align:center}
.over-ask #oaAmount{font-size:44px;line-height:1.1;text-align:center;align-self:center;margin-block:6px}
.over-ask .oa-text small{font-size:15px}
.over-ask .oa-month{font-size:15px}
.over-ask .oa-btns button{font-size:17px;padding:15px 16px}
.oa-text{display:flex;flex-direction:column;gap:2px}
.oa-text b{color:var(--err);font-size:15px}
#oaAmount{font-family:var(--display);font-size:26px;color:var(--err);font-variant-numeric:tabular-nums}
.oa-text small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.oa-month{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.oa-month:empty{display:none}
#oaMonth{margin-top:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,currentColor 15%,transparent)}
.oa-month .up{color:var(--err)} .oa-month .down{color:var(--ok)}
.oa-btns{display:flex;gap:8px}
.oa-btns button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.oa-yes{flex:1;background:var(--err);color:#fff}
.oa-no{background:var(--card);color:var(--ink)}
.over-ask.good{background:var(--ok-soft);border-color:var(--ok)}
.over-ask.good .oa-text b,.over-ask.good #oaAmount{color:var(--ok)}
.over-ask.good .oa-yes{background:var(--ok);color:#fff}
.clear-ask{margin-top:10px;background:var(--err-soft);border:1px solid var(--err);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:800;color:var(--err)}
.ca-btns{display:flex;gap:8px}
.ca-btns button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.ca-yes{background:var(--err);color:#fff}
.ca-no{background:var(--card);color:var(--ink)}
.pin-ask{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pin-ask{align-items:center;text-align:center}
.pin-ask label{font-weight:800;font-size:17px}
.pin-row{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;width:100%}
.pin-row input{box-sizing:border-box;max-width:100%}
.pin-err:empty{display:none}
.pin-row input{width:9em;font:inherit;font-size:24px;letter-spacing:.5em;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.pin-row button{font:inherit;font-weight:800;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.pin-err{min-height:1.2em;font-size:13px;font-weight:800;color:var(--err)}
.pin-ask.shake{animation:shake .35s}
/* the code box floats above the order (nothing moves or hides), near the top so the phone keyboard never covers it */
#pinAsk{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 32px));box-sizing:border-box;margin:0;padding:18px 16px;border-radius:16px;box-shadow:0 0 0 100vmax rgba(15,25,20,.45),0 12px 32px rgba(0,0,0,.25)}
#pinAsk.shake{animation:pinshake .35s}

.home-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center -64vh;background-size:auto 172%;background-color:transparent;opacity:.13;filter:grayscale(.35) contrast(1.05)}
/* opening screen: the photo in full for a second, then it fades into the shadow */
.intro-bg{position:fixed;inset:0;z-index:50;background-color:#1c322a;background-position:center;background-size:cover;opacity:1;transition:opacity 1s ease}
.intro-bg.out{opacity:0;pointer-events:none}
/* on the iPhone home-screen app the screen is taller than the page area: let both photos reach the very bottom */
.home-bg,.intro-bg{bottom:auto;height:calc(max(100lvh, var(--app-h,0px)) + env(safe-area-inset-bottom,0px));min-height:100%}
/* the very first launch of the home-screen app can report a short screen: paint the whole page in the app colour */
html{background:var(--bg);min-height:100%}
html:has(body.on-home){background:var(--bg)}
@media (prefers-reduced-motion:reduce){.intro-bg{transition:none}}
#homeView{position:relative;z-index:1}
/* home fits one screen: the tiles share the space between the logo and the clock */
#homeView{box-sizing:border-box;height:calc(var(--app-h,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;display:flex;flex-direction:column;padding-bottom:84px}
#homeView .tiles{flex:1;min-height:0;grid-auto-rows:minmax(56px,1fr);margin-top:clamp(16px,3.5vh,40px)}
#homeView .tile{min-height:0;padding:10px 12px}
/* status-bar band: dark green so the phone's white clock stays readable; on home it fades into the photo */
body::before{background:#1c322a!important}
body.on-home::before{height:calc(env(safe-area-inset-top,0px) + 36px);background:linear-gradient(to bottom,rgba(28,50,42,.85),rgba(28,50,42,0))!important}
body.on-home{background-color:var(--bg)}
#homeView .clock{background:transparent}
.mhead{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:4px}
.mhead:first-child{margin-top:0}
.mname{font-family:var(--display);font-size:22px;line-height:1.1}
.msum{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.msum .msub{font-size:13px;font-weight:600;opacity:.8;margin-top:2px}
li.section{display:block;background:none;border:0;padding:14px 4px 2px;font-family:var(--display);font-size:18px;color:var(--accent)}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.target{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
input.num{width:100%;box-sizing:border-box;text-align:center;font:inherit;font-weight:700;font-size:18px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input.num::-webkit-outer-spin-button,input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.order{text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);opacity:.6}
.target{opacity:.6;font-weight:600;font-size:15px}
input.num[id^="v_"]{font-size:22px;font-weight:800;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.notes{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.notes label{font-weight:700;font-size:14px}
textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:64px;resize:vertical}

.bar{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:800;font-size:17px;border-radius:10px;padding:13px 16px;border:0;cursor:pointer}
.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.primary:disabled{opacity:.45;cursor:default}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;min-height:1em}
.preview{margin-top:22px}
.preview h2{font-size:15px;margin:0 0 8px}
.preview img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
input.num{caret-color:transparent;cursor:pointer}
input.num.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--card)}
body.kp-open .wrap{padding-bottom:70vh}
.keypad{position:fixed;inset:auto 0 0;z-index:8;background:var(--kp-bg);border-top:1px solid var(--line);padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
.kp-in{max-width:520px;margin:0 auto}
.kp-top{display:flex;justify-content:flex-start;padding:0 4px 2px}
.kp-close{background:none;border:0;color:var(--accent);font:inherit;font-weight:800;font-size:14px;padding:2px 4px;cursor:pointer}
body.kp-open #supView header .meta{display:none}
body.kp-open #supView header{padding-block:4px 6px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kp-grid button{font:inherit;font-size:24px;font-weight:700;height:44px;border:0;border-radius:10px;background:var(--kp-key);color:var(--ink);cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}

.kp-grid .kp-enter{grid-column:1 / -1;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:800;direction:rtl}
:root{--kp-bg:#b8b2a5;--kp-key:#e9e6df}

@media (max-width:380px){
  .cols,li{grid-template-columns:1fr 52px 66px 54px;gap:6px}
  input.num{font-size:16px}
}

#supView:not(.editing) .cols,#supView:not(.editing) #list li{grid-template-columns:1fr 76px 64px}

const MEM = {};

// shared between all phones: order history, targets, prices, names, added / hidden / removed products
var SYNC_DB="https://halechmania-orders-default-rtdb.europe-west1.firebasedatabase.app/shops/halechmania-rishon";
var OP_RE_S=/^hl_(targets|prices|names|extra|hidden|removed)_/;
var syncRe=/^hl_(hist|histreset|targets|prices|names|extra|hidden|removed)_/;
function syncGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function syncPut(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function syncMark(k){
  if(!syncRe.test(k)) return;
  const t=Date.now(), m=syncGet("hl_sync_meta",{}), p=syncGet("hl_sync_pending",{});
  m[k]=t; p[k]=t; syncPut("hl_sync_meta",m); syncPut("hl_sync_pending",p); syncSoon();
}
var syncTimer=null, syncBusy=false;
function syncSoon(){ clearTimeout(syncTimer); syncTimer=setTimeout(syncFlush,300); }
async function syncFlush(){
  if(syncBusy){ syncSoon(); return; }
  syncBusy=true;
  try{
    const pend=syncGet("hl_sync_pending",{}), meta=syncGet("hl_sync_meta",{}), done={};
    for(const k of Object.keys(pend)){
      try{
        let r;
        if(k.startsWith("hl_hist_")){
          // deleted orders are kept as "DEL" marks so no phone brings them back
          const tomb=syncGet("hl_histdel_"+k.slice(8),[]);
          const g=await fetch(SYNC_DB+"/hist/"+k+".json",{cache:"no-store"}); if(!g.ok) continue;
          const remote=(await g.json())||{};
          const obj={}; syncGet(k,[]).forEach(o=>{ if(o && o.ts && remote["t"+o.ts]!=="DEL" && !tomb.includes(o.ts)) obj["t"+o.ts]=JSON.stringify(o); });
          tomb.forEach(ts=>{ obj["t"+ts]="DEL"; });
          if(!Object.keys(obj).length){ done[k]=pend[k]; continue; }
          r=await fetch(SYNC_DB+"/hist/"+k+".json",{method:"PATCH",body:JSON.stringify(obj)});
        } else {
          r=await fetch(SYNC_DB+"/set/"+k+".json",{method:"PUT",body:JSON.stringify({v:localStorage.getItem(k)||"null",t:meta[k]||pend[k]})});
        }
        if(r.ok) done[k]=pend[k];
      }catch(e){}
    }
    const p=syncGet("hl_sync_pending",{});
    Object.keys(done).forEach(k=>{ if(p[k]===done[k]) delete p[k]; });
    syncPut("hl_sync_pending",p);
    if(Object.keys(p).length) setTimeout(syncFlush,15000);
  } finally { syncBusy=false; }
}
async function syncPull(){
  let data;
  try{ const r=await fetch(SYNC_DB+".json",{cache:"no-store"}); if(!r.ok) return; data=(await r.json())||{}; }catch(e){ return; }
  const meta=syncGet("hl_sync_meta",{}), pend=syncGet("hl_sync_pending",{});
  let changed=false;
  const set=data.set||{};
  Object.keys(set).forEach(k=>{
    const rv=set[k];
    if(!syncRe.test(k) || pend[k] || !rv || typeof rv.v!=="string") return;
    if(!(k in meta) || rv.t>meta[k]){
      if(localStorage.getItem(k)!==rv.v){ try{ localStorage.setItem(k,rv.v); }catch(e){} changed=true; }
      meta[k]=rv.t;
    }
  });
  // first time on this phone: send up whatever exists only here
  Object.keys(localStorage).forEach(k=>{
    if(syncRe.test(k) && !k.startsWith("hl_hist_") && !(k in meta) && !set[k]){ meta[k]=Date.now(); pend[k]=meta[k]; }
  });
  // order history: everything from every phone, merged by time
  const hist=data.hist||{};
  const hkeys=new Set(Object.keys(hist).filter(k=>k.startsWith("hl_hist_")));
  Object.keys(localStorage).forEach(k=>{ if(k.startsWith("hl_hist_")) hkeys.add(k); });
  hkeys.forEach(k=>{
    const cut=Number(syncGet("hl_histreset_"+k.slice(8),0))||0;
    const local=syncGet(k,[]), byTs={};
    const remote=hist[k]||{};
    const tk="hl_histdel_"+k.slice(8), tomb=syncGet(tk,[]), tn=tomb.length;
    Object.keys(remote).forEach(id=>{ if(remote[id]==="DEL"){ const ts=Number(id.slice(1)); if(!tomb.includes(ts)) tomb.push(ts); } });
    if(tomb.length!==tn) syncPut(tk,tomb);
    Object.keys(remote).forEach(id=>{ try{ if(remote[id]==="DEL") return; const o=JSON.parse(remote[id]); if(o && o.ts && o.ts>cut && !tomb.includes(o.ts)) byTs[o.ts]=o; }catch(e){} });
    let extra=false;
    local.forEach(o=>{ if(o && o.ts && o.ts>cut && !tomb.includes(o.ts) && !byTs[o.ts]){ byTs[o.ts]=o; extra=true; } });
    if(extra && !pend[k]) pend[k]=Date.now();
    const merged=Object.values(byTs).sort((a,b)=>b.ts-a.ts).slice(0,120);
    if(JSON.stringify(merged)!==JSON.stringify(local)){ syncPut(k,merged); changed=true; }
  });
  syncPut("hl_sync_meta",meta); syncPut("hl_sync_pending",pend);
  // changes made in the Claude link, carried by this site file: applied once for everyone
  const seedDone=data.seeds||{}, seedMark={};
  SEED_OPS.slice().sort((a,b)=>a.t-b.t).forEach(o=>{
    const id=(o.k+"__"+o.f+"@"+o.t).replace(/[.#$\[\]\/]/g,"_");
    if(seedDone[id] || !OP_RE_S.test(o.k)) return;
    const kind=o.k.match(OP_RE_S)[1];
    let v=null; try{ v=o.v==null?null:JSON.parse(o.v); }catch(e){ return; }
    if(kind==="extra"){ const a=syncGet(o.k,[]).filter(x=>x.id!==o.f); if(o.op==="set" && v) a.push(v); save(o.k,a); }
    else if(kind==="hidden"||kind==="removed"){ const a=syncGet(o.k,[]).filter(x=>String(x)!==o.f); if(o.op==="set") a.push(o.f); save(o.k,a); }
    else { const m=syncGet(o.k,{}); if(o.op==="set") m[o.f]=v; else delete m[o.f]; save(o.k,m);
      if(kind==="prices" && o.op==="set" && v!=null){ const sp=SUPPLIERS.find(s=>!s.base && "hl_prices_"+dataKey(s)===o.k); if(sp) fillHistPrice(sp,o.f,v); } }
    seedMark[id]=true; changed=true;
  });
  if(Object.keys(seedMark).length) fetch(SYNC_DB+"/seeds.json",{method:"PATCH",body:JSON.stringify(seedMark)}).catch(()=>{});
  if(Object.keys(syncGet("hl_sync_pending",{})).length) syncSoon();
  if(changed) syncRefresh();
}

function stateOf(s){

  if(!day || day.date!==todayKey()) day = {date:todayKey(), vals:{}, note:""};
  // prices updated on this phone override the invoice prices
  // products added on this phone, and renamed products
  const extra = load("hl_extra_"+dataKey(s),[]);
  extra.forEach(x=>{ if(!s.products.some(p=>p.id===x.id)) s.products.push({id:x.id,name:x.name,target:x.target,custom:true,basePrice:null,price:null}); });
  const names = load("hl_names_"+dataKey(s),{});
  s.products.forEach(p=>{
    if(p.baseName===undefined){ p.baseName=p.name; p.baseFr=p.fr; p.baseTi=p.ti; }
    const n=names[p.id]||{};
    p.name = n.he || p.baseName; p.fr = n.fr || p.baseFr; p.ti = n.ti || p.baseTi;
  });
  const prices = load("hl_prices_"+dataKey(s),{});

  const hidden = load("hl_hidden_"+dataKey(s),[]), removed = load("hl_removed_"+dataKey(s),[]);

}

let repPeriod="month";
function repRange(){
  // [from, until, label]
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth(), d0=new Date(y,mo,now.getDate()), D=86400000, END=8.64e15;
  const ws=new Date(d0); ws.setDate(d0.getDate()-d0.getDay());
  const f=d=>d.toLocaleDateString("he-IL");
  if(repPeriod==="day") return [d0.getTime(),END,"היום · "+f(d0)];
  if(repPeriod==="week") return [ws.getTime(),END,"השבוע · מ־"+f(ws)];
  if(repPeriod==="lastweek"){ const a=new Date(ws.getTime()-7*D), b=new Date(ws.getTime()-D); return [a.getTime(),ws.getTime(),"השבוע שעבר · "+f(a)+"–"+f(b)]; }
  if(repPeriod==="month") return [new Date(y,mo,1).getTime(),END,"החודש · "+mLabel(mKey(now))];
  if(repPeriod==="lastmonth"){ const a=new Date(y,mo-1,1); return [a.getTime(),new Date(y,mo,1).getTime(),"החודש שעבר · "+mLabel(mKey(a))]; }
  return null;
}
function repPrev(){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth(), d0=new Date(y,mo,now.getDate()), D=86400000;

  const a=f(orders[0].ts), b=f(orders[orders.length-1].ts);

function repData(){

// ---------- PDF: draw each A4 page on a canvas (handles Hebrew right-to-left), then wrap as PDF
async function drawPages(s){
  try{ await Promise.all([document.fonts.load('48px "Secular One"'),document.fonts.load('700 30px "Assistant"'),document.fonts.load('400 30px "Assistant"')]); }catch(e){}
  const cv=document.getElementById("cv"); const W=1240,H=1754,M=90;
  const ctx=cv.getContext("2d");
  const rows=linesOf(s,st); const d=new Date();
  const perFirst=22, perNext=30; const pages=[rows.slice(0,perFirst)];
  for(let i=perFirst;i<rows.length;i+=perNext) pages.push(rows.slice(i,i+perNext));
  const out=[]; const ink="#1c2a24", green="#1c322a", grey="#5c5e55", line="#c7c2b5";
  pages.forEach((pg,pi)=>{
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.direction="rtl"; ctx.textAlign="right"; ctx.textBaseline="alphabetic";
    let y=M+40;
    if(pi===0){
      ctx.fillStyle=green; ctx.font='56px "Secular One", "Assistant", sans-serif';
      ctx.fillText(s.pdfName||s.name,W-M,y);
      ctx.textAlign="left"; ctx.fillStyle=grey; ctx.font='400 30px "Assistant", sans-serif';
      ctx.fillText(d.toLocaleDateString("he-IL")+"  "+fmtTime(d),M,y); ctx.textAlign="right";
      y+=60;
      ctx.fillStyle=ink; ctx.font='700 34px "Assistant", sans-serif';
      ctx.fillText(BUSINESS,W-M,y); y+=46;
      ctx.font='400 30px "Assistant", sans-serif';
      ctx.fillText(branch().pdf,W-M,y); y+=34;
      ctx.fillStyle=green; ctx.fillRect(M,y,W-2*M,4); y+=60;
    } else {
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif';
      ctx.fillText(BUSINESS+" · המשך הזמנה · "+d.toLocaleDateString("he-IL")+" "+fmtTime(d),W-M,y); y+=50;
    }
    ctx.fillStyle=grey; ctx.font='700 26px "Assistant", sans-serif';
    ctx.fillText("#",W-M,y); ctx.fillText("מוצר",W-M-70,y);
    ctx.textAlign="left"; ctx.fillText("כמות",M+10,y); ctx.textAlign="right";
    y+=22; ctx.fillStyle=line; ctx.fillRect(M,y,W-2*M,2); y+=8;
    const rowH=52;
    pg.forEach((x,ri)=>{
      const n=(pi===0?0:perFirst+(pi-1)*perNext)+ri+1;
      if(ri%2===0){ ctx.fillStyle="#efede8"; ctx.fillRect(M,y,W-2*M,rowH); }
      const base=y+36;
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif'; ctx.fillText(String(n),W-M-6,base);
      ctx.fillStyle=ink; ctx.font='600 30px "Assistant", sans-serif';
      let nm=x.p.name; const maxW=W-2*M-260;
      while(ctx.measureText(nm).width>maxW && nm.length>4) nm=nm.slice(0,-2)+"…";
      ctx.fillText(nm,W-M-70,base);
      ctx.textAlign="left"; ctx.fillStyle=green; ctx.font='700 34px "Assistant", sans-serif';
      ctx.fillText(String(x.o),M+14,base); ctx.textAlign="right";
      y+=rowH;
    });
    if(pi===pages.length-1){
      y+=20; ctx.fillStyle=line; ctx.fillRect(M,y,W-2*M,2); y+=50;
      ctx.fillStyle=ink; ctx.font='700 30px "Assistant", sans-serif';
      ctx.fillText("סה״כ שורות: "+rows.length,W-M,y); y+=56;
      if(st.day.note){
        ctx.fillText("הערה:",W-M,y); y+=44;
        ctx.font='400 30px "Assistant", sans-serif';
        let ln="";
        st.day.note.split(/\s+/).forEach(w=>{ const t=ln?ln+" "+w:w; if(ctx.measureText(t).width>W-2*M){ ctx.fillText(ln,W-M,y); y+=42; ln=w; } else ln=t; });
        if(ln){ ctx.fillText(ln,W-M,y); y+=42; }
      }
      ctx.fillStyle=grey; ctx.font='400 28px "Assistant", sans-serif';
      ctx.fillText("תודה!",W-M,y+30);
    }
    ctx.fillStyle=grey; ctx.font='400 22px "Assistant", sans-serif'; ctx.textAlign="center";
    ctx.fillText("הופק ב-"+fmtDate(d)+" בשעה "+fmtTime(d)+"   ·   עמוד "+(pi+1)+" מתוך "+pages.length,W/2,H-50); ctx.textAlign="right";
    out.push(cv.toDataURL("image/jpeg",0.92));
  });
  return out;
}

// ---------- smart order: fill every row from the average of the last orders
const SMART_N = 5;
let smartArmed=false;
document.getElementById("smartBtn").addEventListener("click",()=>{
  const btn=document.getElementById("smartBtn");
  const h=load("hl_hist_"+dataKey(cur),[]).slice(0,SMART_N);
  const hasValues=cur.products.some(p=>String(st.day.vals[p.id] ?? "").trim()!=="");
  if(hasValues && !smartArmed){
    smartArmed=true; btn.textContent=tr().smartArm;
    setTimeout(()=>{ smartArmed=false; btn.textContent=tr().smart; },3000);
    return;
  }
  smartArmed=false; btn.textContent=tr().smart;
  if(!h.length){
    // no orders yet: full order – every product up to its target
    cur.products.forEach(p=>{ if(!p.section && !excluded(p,st) && targetOf(p,st)!=null) st.day.vals[p.id]="0"; });
    saveDay(); render(); window.scrollTo(0,0);
    setStatus(tr().smartFull);
    return;
  }
  const avg={};
  h.forEach(o=>o.items.forEach(it=>{ avg[it.id]=(avg[it.id]||0)+Number(it.q||0); }));
  cur.products.forEach(p=>{
    if(p.section || excluded(p,st)) return;
    const a=Math.round((avg[p.id]||0)/h.length);   // missing in an order counts as 0
    const t=targetOf(p,st);
    if(t!=null) st.day.vals[p.id]=String(Math.max(0,t-a)); // "נשאר" so that target − נשאר = average
    else st.day.vals[p.id]= a>0 ? String(a) : "";
  });
  saveDay(); render(); window.scrollTo(0,0);
  setStatus(tr().smartDone(h.length));
});

function histRow(d,o){
  const w=document.createElement("div"); w.className="hrow";
  const del=document.createElement("button"); del.type="button"; del.className="hdel"; del.textContent=tr().del;
  del.addEventListener("click",()=>{ w._close(); askDelOrder(o); });
  w.append(del,d);
  const sign = tr().dir==="rtl" ? 1 : -1, W=96;
  let x0=null, y0=null, dx=0, drag=false, open=false;
  const put=(v,anim)=>{ d.style.transition=anim?"transform .2s ease":"none"; d.style.transform=v?"translateX("+v+"px)":""; };
  d.addEventListener("touchstart",e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; drag=false; },{passive:true});
  d.addEventListener("touchmove",e=>{
    if(x0==null) return;
    const t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!drag){
      if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3){ drag=true; document.querySelectorAll(".hrow").forEach(r=>{ if(r!==w && r._close) r._close(); }); }
      else if(Math.abs(my)>10){ x0=null; return; }
      else return;
    }
    e.preventDefault();
    dx=(open?sign*W:0)+mx;
    dx = sign>0 ? Math.max(0,Math.min(dx,W+30)) : Math.min(0,Math.max(dx,-W-30));
    put(dx,false);
  },{passive:false});
  d.addEventListener("touchend",()=>{ if(drag){ open=Math.abs(dx)>W/2; put(open?sign*W:0,true); } x0=null; });
  d.querySelector("summary").addEventListener("click",e=>{
    if(drag){ e.preventDefault(); drag=false; return; }
    if(open){ e.preventDefault(); w._close(); }
  });
  w._close=()=>{ open=false; dx=0; put(0,true); };
  return w;
}

function needsName(){ return (cur && editing) ? cur.products.find(p=>p.custom && !excluded(p,st) && !String(pname(p)||"").trim()) : null; }
function blockNoName(p){
  const inp=document.getElementById("n_"+p.id), li=inp && inp.closest("li");
  if(li){ li.classList.add("noname"); li.classList.remove("shake"); void li.offsetWidth; li.classList.add("shake"); li.scrollIntoView({block:"center"}); }
  setStatus(tr().nameReq);
  closeKeypad();
  if(inp) inp.focus();
  try{ navigator.vibrate && navigator.vibrate(120); }catch(_){}
}
["editDoneBtn","editBtn","backBtn","histBtn","smartBtn","clearBtn"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{
    const p=needsName(); if(!p) return;
    e.preventDefault(); e.stopImmediatePropagation(); blockNoName(p);
  },true);
});
function removeProduct(p){
  if(p.custom){
    st.extra=st.extra.filter(x=>x.id!==p.id); save("hl_extra_"+dataKey(cur),st.extra);
    const i=cur.products.indexOf(p); if(i>=0) cur.products.splice(i,1);
  } else {
    if(!st.removed.includes(p.id)) st.removed.push(p.id);
    save("hl_removed_"+dataKey(cur),st.removed);
  }
  delete st.day.vals[p.id]; saveDay(); render();
  setStatus(tr().deleted(pname(p)));
}
function unmarked(){ return cur ? cur.products.filter(p=>!p.section && !excluded(p,st) && targetOf(p,st)!=null && String(st.day.vals[p.id] ?? "").trim()==="") : []; }
document.getElementById("pdfBtn").addEventListener("click",e=>{
  if(!cur) return;
  const miss=unmarked();
  if(!miss.length) return;
  e.stopImmediatePropagation();
  miss.forEach(p=>{ const li=list.querySelector('li[data-id="'+p.id+'"]'); if(li) li.classList.add("unmarked"); });
  const first=list.querySelector('li[data-id="'+miss[0].id+'"]');
  setStatus(tr().notMarked(miss.length));
  if(first){
    first.classList.remove("shake"); void first.offsetWidth; first.classList.add("shake");
    const inp=first.querySelector('input[id^="v_"]'); if(inp) inp.focus();
  }
  try{ navigator.vibrate && navigator.vibrate(150); }catch(_){}
},true);
// ---------- over the previous order? ask before sending
let overApproved=false;
function prevTotal(s){
  const h=load("hl_hist_"+dataKey(s),[]);
  const last=h.find(o=>o.total!=null);
  return last ? last.total : null;
}
document.getElementById("pdfBtn").addEventListener("click",e=>{
  if(!cur || !hasPrices(cur) || unmarked().length) return; // only suppliers with prices
  if(overApproved){ overApproved=false; return; }
  // compare the money total with the previous order
  const priced=hasPrices(cur);
  let prev, now;
  if(priced){ prev=prevTotal(cur); now=totalOf(cur).sum; }
  else {
    const last=load("hl_hist_"+dataKey(cur),[])[0];
    if(!last) return;
    const sum=a=>Math.round(a.reduce((t,v)=>t+Number(v||0),0)*100)/100;
    prev=sum(last.items.map(i=>i.q)); now=sum(linesOf(cur,st).map(x=>x.o));
  }
  if(prev==null || Math.abs(now-prev) < 0.005) return;
  const up = now > prev;
  e.preventDefault(); e.stopImmediatePropagation();
  const x=tr(), diff=Math.round(Math.abs(now-prev)*100)/100;
  document.getElementById("overAsk").classList.toggle("good",!up);
  document.getElementById("oaTitle").textContent= priced ? (up ? x.oaTitle : x.gaTitle) : (up ? x.oaTitleU : x.gaTitleU);
  document.getElementById("oaAmount").textContent= priced ? x.oaAmount(diff) : x.unitsN(diff);
  document.getElementById("oaDetail").textContent= priced ? x.oaDetail(prev,now) : x.oaDetailU(prev,now);
  document.getElementById("oaYes").textContent= up ? x.oaYes : x.gaYes;
  document.getElementById("oaNo").textContent= up ? x.oaNo : x.gaNo;
  // this month so far (with this order) and the month before
  { const h=load("hl_hist_"+dataKey(cur),[]), d=new Date();
    const ym=dt=>dt.getFullYear()*12+dt.getMonth(), thisM=ym(d);
    const sumM=m=>{ let t=0,c=0; h.forEach(o=>{ if(o.total!=null && ym(new Date(o.ts))===m){ t+=o.total; c++; } }); return {t:Math.round(t*100)/100,c}; };
    const mName=m=>new Date(Math.floor(m/12),m%12,1).toLocaleDateString(x.locale,{month:"long"});
    const cm=sumM(thisM), pm=sumM(thisM-1), monthNow=Math.round((cm.t+now)*100)/100;
    document.getElementById("oaMonth").textContent=x.monthLine(mName(thisM),monthNow);
    const mc=document.getElementById("oaMonthCmp"); mc.textContent="";
    if(pm.c){
      const dlt=Math.round((monthNow-pm.t)*100)/100, sp=document.createElement("span");
      sp.className = dlt>0 ? "up" : "down";
      sp.textContent = Math.abs(dlt)<0.005 ? x.monthSame(mName(thisM-1)) : (dlt>0 ? x.monthUp(mName(thisM-1),pm.t,dlt) : x.monthDown(mName(thisM-1),pm.t,-dlt));
      mc.appendChild(sp);
    } else mc.textContent=x.monthNone(mName(thisM-1));
  }
  { const hb=document.querySelector("#supView header").getBoundingClientRect().bottom;
    document.getElementById("overAsk").style.setProperty("--oa-top", Math.max(8,Math.round(hb+8))+"px"); }
  document.getElementById("overAsk").hidden=false;
  document.getElementById("pdfBtn").hidden=true; // the box has its own send button
  setStatus("");
  try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(_){}
},true);
document.getElementById("oaYes").addEventListener("click",()=>{
  document.getElementById("overAsk").hidden=true;
  document.getElementById("pdfBtn").hidden=false;
  overApproved=true;
  document.getElementById("pdfBtn").click();
});
document.getElementById("oaNo").addEventListener("click",()=>{
  document.getElementById("overAsk").hidden=true;
  document.getElementById("pdfBtn").hidden=false;
  setStatus(tr().oaCancelled);
});

let pendingFile=null, pendingSup=null;
function afterSent(s){
  recordOrder(s,lastSnap); lastSnap=null;
  save("hl_day_"+dataKey(s),{date:todayKey(),vals:{},note:""});
  pendingFile=null; pendingSup=null;
  document.getElementById("pdfBtn").textContent=tr().send;
  if(cur===s) showHome();
}
async function shareFile(file,s){
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file]});
      afterSent(s);
    }catch(e){
      if(e && e.name==="NotAllowedError"){
        pendingFile=file; pendingSup=s;
        document.getElementById("pdfBtn").textContent=tr().ready;
        setStatus(tr().tapAgain);
      } else if(e && e.name==="AbortError"){ setStatus(tr().cancelled); }
      else setStatus(tr().shareFail);
    }
  } else {
    const url=URL.createObjectURL(file); const a=document.createElement("a");
    a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    afterSent(s);
  }
}
document.getElementById("pdfBtn").addEventListener("click",e=>{
  if(!pendingFile) return;
  e.stopImmediatePropagation();
  const f=pendingFile, s=pendingSup;
  navigator.share({files:[f]}).then(()=>afterSent(s)).catch(err=>{
    if(err && err.name==="AbortError") setStatus(tr().cancelled); else setStatus(tr().shareFail);
  });
},true);
document.getElementById("pdfBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("pdfBtn"); btn.disabled=true; setStatus(tr().preparing);
  const s=cur;
  try{
    const imgs=await drawPages(s);
    if(!window.jspdf){ setStatus(tr().noLib); return; }
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    imgs.forEach((im,i)=>{ if(i) pdf.addPage(); pdf.addImage(im,"JPEG",0,0,210,297); });
    const blob=pdf.output("blob");
    lastSnap=snapshotOrder(s);
    const d=new Date();
    const fname="הזמנה הלחמניא - "+(s.pdfName||s.name).replace(/["״]/g,"")+" "+d.getDate()+"-"+(d.getMonth()+1)+"-"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0")+".pdf";
    const file=new File([blob],fname,{type:"application/pdf"});
    await shareFile(file,s);
    return;
    // order sent: reset this supplier's count so the next order starts clean
    recordOrder(s,lastSnap); lastSnap=null;
    save("hl_day_"+dataKey(s),{date:todayKey(),vals:{},note:""});
    if(cur===s){ showHome(); }
  }catch(e){
    const c=e&&e.code;
    if(c==="declined") setStatus(tr().cancelled);
    else if(c==="rate_limited") setStatus(tr().busy);
    else setStatus(tr().fail);
  }finally{ if(cur===s) summary(); btn.disabled = cur ? linesOf(cur,st).length===0 : false; }
});

const fmtTime = d => d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
function tick(){
  const now=new Date(), c=document.getElementById("clock");
  const parts=[
    [now.toLocaleDateString("he-IL",{weekday:"long"}),""],
    [now.toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"numeric"}),"t"],
    [now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),"t"]];
  c.textContent="";
  parts.forEach(([txt,cls],i)=>{
    if(i){ const sp=document.createElement("span"); sp.className="sep"; sp.textContent="|"; c.appendChild(sp); }
    const e=document.createElement("span"); if(cls) e.className=cls; e.textContent=txt; c.appendChild(e);
  });
}
tick(); setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
// draw every ₪ sign in the phone's own font (the page fonts draw it differently)
(function(){
  const wrap=root=>{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes("₪") && !(n.parentNode && n.parentNode.classList && n.parentNode.classList.contains("sh")) ? 1 : 3});
    const list=[]; while(w.nextNode()) list.push(w.currentNode);
    list.forEach(n=>{
      const parts=n.nodeValue.split("₪"), f=document.createDocumentFragment();
      parts.forEach((t,i)=>{ if(i){ const sp=document.createElement("span"); sp.className="sh"; sp.textContent="₪"; f.appendChild(sp); } if(t) f.appendChild(document.createTextNode(t)); });
      n.parentNode.replaceChild(f,n);
    });
  };
  new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==="characterData"){ if(m.target.parentNode) wrap(m.target.parentNode); } else m.addedNodes.forEach(x=>wrap(x.nodeType===3 && x.parentNode ? x.parentNode : x)); }))
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  wrap(document.body);
})();
showHome();
(function(){
  const ib=document.getElementById("introBg"); if(!ib) return;
  const done=()=>{ ib.hidden=true; };
  setTimeout(()=>{ ib.classList.add("out"); setTimeout(done,1100); },1000);
  ib.addEventListener("click",()=>{ ib.classList.add("out"); setTimeout(done,400); });
})();
</script>
